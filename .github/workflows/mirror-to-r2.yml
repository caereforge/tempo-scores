name: Mirror catalog to R2

# Validates every score on PR, and mirrors the catalog + index to the R2 bucket
# backing downloads.tempoapp.app on pushes to main.
#
# Secrets required on the repo:
#   R2_ACCOUNT_ID       — Cloudflare account id
#   R2_ACCESS_KEY_ID    — scoped R2 API token (Edit) for bucket tempo-downloads
#   R2_SECRET_ACCESS_KEY
#
# Disabled until the R2 token and secrets are provisioned. Remove the `if: false`
# guard to activate.

on:
  push:
    branches: [main]
    paths:
      - 'scores/**'
      - 'schema/**'
      - '.github/workflows/mirror-to-r2.yml'
  pull_request:
    paths:
      - 'scores/**'
      - 'schema/**'

jobs:
  validate:
    name: Validate score JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ajv
        run: npm install -g ajv-cli@5
      - name: Validate every score against schema
        run: |
          set -e
          shopt -s nullglob
          for f in scores/*.json; do
            echo "→ $f"
            ajv validate -s schema/score.schema.json -d "$f" --strict=false
          done

  mirror:
    name: Mirror to R2
    # Enable once R2 secrets are set. Also restricts to push-on-main.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build catalog index
        run: |
          set -e
          mkdir -p dist
          cp -R scores dist/scores
          cp -R schema dist/schema
          python3 - <<'EOF'
          import json, os, pathlib
          items = []
          for f in sorted(pathlib.Path("scores").glob("*.json")):
              data = json.loads(f.read_text())
              items.append({
                  "file": f.name,
                  "providerIdentifier": data.get("providerIdentifier"),
                  "displayName": data.get("displayName"),
                  "color": data.get("color"),
                  "url": f"https://downloads.tempoapp.app/scores/{f.name}",
              })
          pathlib.Path("dist/index.json").write_text(
              json.dumps({"version": 1, "scores": items}, indent=2) + "\n"
          )
          EOF
      - name: Upload to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          command: >-
            r2 object put tempo-downloads/scores-index.json --file dist/index.json --content-type application/json
